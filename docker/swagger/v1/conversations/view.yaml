get:
  tags:
    - Conversations
  summary: View a conversation
  operationId: viewConversation
  parameters:
    - name: Id
      in: query
      required: true
      description: The conversation Id I want to see
      schema:
        type: string
        example: con_66cd76e11574

  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                description: Indicates if the conversation was create
                example: true
              data:
                type: object
                properties:
                  contextId:
                    type: string
                    description: The ID of the context associated with the conversation
                    example: cot_690c4fcf71048
                  title:
                    type: string
                    description: The formatted title of the conversation (e.g., "Conversation du 15/01/2024 10:30")
                    example: "Conversation du 15/01/2024 10:30"
                  pairs:
                    type: array
                    description: Array of conversation pairs (prompt/answer)
                    items:
                      type: object
                      properties:
                        prompt:
                          type: string
                          description: The user's prompt/question
                          example: Bonjour
                        answer:
                          type: string
                          description: The bot's response
                          example: Bonjour! Comment puis-je vous aider aujourd'hui?
                        codeStatus:
                          type: integer
                          description: HTTP status code of the response
                          example: 200
                description: Data returned by the view conversation service
    
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                description: Indicates whether the conversation was created
                example: false
              error:
                type: string
                description: The message error
                example: NoIdException 