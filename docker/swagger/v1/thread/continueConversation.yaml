post:
  tags:
    - Thread
  summary: Continue an assistant conversation
  operationId: continueAssistantConversation
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            conversation_id:
              type: string
              description: The ID of the conversation to continue
              example: con_66680a4a5ee25
            message:
              type: string
              description: The message to send to the assistant
              example: Peux-tu m'expliquer plus en détail ?

  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                description: Indicates whether the conversation was continued successfully
                example: true
              data:
                type: object
                properties:
                  conversationId:
                    type: string
                    description: The ID of the conversation
                    example: con_66c58c7ee6c58
                  message:
                    type: string
                    description: The assistant's response
                    example: Bien sûr ! Je vais vous expliquer plus en détail...
              description: Data returned by the continue assistant conversation service
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                description: Indicates whether the conversation was continued
                example: false
              error:
                type: string
                description: The error message
                example: Aucun thread trouvé pour cette conversation
